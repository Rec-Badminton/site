message: 'Ouverture des inscriptions mi-septembre 2026 (date précise à venir), après séance d''essai du 7 au 13 sept ! '
trial: |
  Tu hésites et préfères participer à un entrainement avant de t'inscrire ? Pas de problème ! Deux séances d'essais maximum sont acceptées.

  Lors de chaque séance, il est impératif de :

  * Prévenir en amont de ta venue en envoyant un mail, plusieurs jours avant (places limitées même pour les essais). Nous pourrons également te guider pour trouver le créneau le plus adapté à tes envies. Attention, les places et la disponibilité des créneaux peuvent très vite partir en début de saison.
  * Te présenter au début du créneau à un membre du bureau
  * Remplir le petit formulaire, **le jour même de ta séance**, en flashant ou cliquant sur le QR Code ci-contre. Ce formulaire te permet d’être assuré pendant 24h pour la pratique du badminton
  * **Séances d'essais possibles du 7 au 13 septembre 2026.** Une partie des gymnases seront encore fermés la première semaine de septembre, merci de vous renseigner en amont en vérifiant le calendrier dans l'onglet "Créneaux" de notre site web. (Nous n'avons malheureusement pas de matériel, raquettes et volants, à vous prêter pour les essais)
  * **Ouverture des inscriptions mi-septembre : date et heure précise à venir (sera préciser en août).** Seuls les dossiers complets seront acceptés. Places limitées, **pas de réservation d’inscription possible**. Certains créneaux sont déjà complets uniquement avec les réinscriptions des joueurs de l'année passée.
