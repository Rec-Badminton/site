name: Functions

# Cloud Functions are versioned with the code: main deploys them whenever they change.
on:
  push:
    branches: [main]
    paths: ['functions/**', firebase.json, .firebaserc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # --force deletes functions removed from the code instead of prompting
      - name: Deploy Cloud Functions
        run: npx --yes firebase-tools@15 deploy --only functions --force --non-interactive
