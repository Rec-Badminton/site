name: Quality

# GitFlow: feature/* and hotfix/* open pull requests into develop (or main for a hotfix),
# develop is the integration branch, main is production.
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        task: [format:check, lint, typecheck, test]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}

  # Cloud Functions compile with their own strict tsconfig; their tests run in the test job.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: npm run build

  # Every pull request and protected branch builds, so a broken build never reaches main.
  build:
    needs: checks
    uses: ./.github/workflows/build.yml
    secrets: inherit
